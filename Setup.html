<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <style>
      body { color: #172033; font: 14px system-ui, sans-serif; margin: 2rem auto; max-width: 44rem; }
      h1 { margin-bottom: .25rem; }
      p { line-height: 1.45; }
      label { display: block; font-weight: 650; margin-top: 1rem; }
      input, textarea { box-sizing: border-box; font: inherit; margin-top: .35rem; padding: .6rem; width: 100%; }
      textarea { min-height: 4rem; resize: vertical; }
      button { background: #1455b8; border: 0; border-radius: .35rem; color: white; cursor: pointer; font: inherit; font-weight: 650; margin: 1.25rem .5rem 0 0; padding: .7rem 1rem; }
      button.secondary { background: #455468; }
      button.danger { background: #b42318; }
      #status { margin-top: 1rem; white-space: pre-wrap; }
      .hint { color: #526174; font-size: .9rem; }
    </style>
  </head>
  <body>
    <h1>Workflow Sheets Adapter</h1>
    <p id="intro">Configure as fontes para mesclar alertas em uma planilha central.</p>
    <form id="setup-form"></form>
    <div id="migration-actions">
      <button id="create-central" type="button">Criar planilha central</button>
      <button id="merge" class="secondary" type="button">Mesclar dados</button>
      <button id="delete-sources" class="danger" type="button">Excluir fontes mescladas</button>
      <button id="inspect-delete-access" class="secondary" type="button">Verificar acesso às fontes</button>
    </div>
    <button id="rotate-token" class="secondary" type="button">Gerar novo token</button>
    <p id="status" role="status"></p>

    <script>
      const form = document.getElementById('setup-form');
      const status = document.getElementById('status');
      const intro = document.getElementById('intro');
      const migrationActions = document.getElementById('migration-actions');
      let state;

      google.script.run.withSuccessHandler(render).getSetupState();
      document.getElementById('delete-sources').addEventListener('click', () => {
        if (!confirm('Excluir permanentemente as seis planilhas fonte já mescladas? Esta ação não pode ser desfeita.')) return;
        status.textContent = 'Excluindo as planilhas fonte…';
        google.script.run
          .withSuccessHandler((result) => {
            render({ ...state, sheets: state.sheets.map((sheet) => sheet.isCentral ? sheet : { ...sheet, configured: false, spreadsheetUrl: '' }) });
            status.textContent = `Excluídas permanentemente: ${result.deletedSheets.join(', ')}.`;
          })
          .withFailureHandler(showError)
          .permanentlyDeleteMergedSources();
      });
      document.getElementById('inspect-delete-access').addEventListener('click', () => {
        status.textContent = 'Verificando propriedade e acesso às planilhas fonte…';
        google.script.run
          .withSuccessHandler((result) => {
            status.textContent = JSON.stringify(result, null, 2);
          })
          .withFailureHandler(showError)
          .inspectSourceDeletionAccess();
      });
      document.getElementById('rotate-token').addEventListener('click', () => {
        if (!confirm('Gerar um token novo? Os userscripts configurados com o token anterior precisarão ser atualizados.')) return;
        google.script.run
          .withSuccessHandler((next) => {
            render(next);
            status.textContent = 'Token substituído. Atualize o token nos userscripts.';
          })
          .withFailureHandler(showError)
          .rotateAccessToken();
      });
      document.getElementById('create-central').addEventListener('click', () => save('central'));
      document.getElementById('merge').addEventListener('click', () => {
        status.textContent = 'Lendo e copiando os registros…';
        google.script.run
          .withSuccessHandler((result) => {
            status.textContent = `Mesclagem concluída: ${result.importedRows} registros em ${result.importedTabs.length} abas.\n${result.spreadsheetUrl}`;
          })
          .withFailureHandler(showError)
          .mergeConfiguredSheets();
      });

      function save(action) {
        const values = formValues();
        status.textContent = action === 'central' ? 'Criando central e validando fontes…' : 'Validando acesso às planilhas…';
        const runner = google.script.run
          .withSuccessHandler((next) => {
            render(next);
            status.textContent = action === 'central'
              ? 'Planilha central criada. Agora use Mesclar dados.'
              : 'Configuração salva.';
          })
          .withFailureHandler(showError);
        if (action === 'central') runner.createCentralWorkbook(values);
        else runner.saveSetupState(values);
      }

      function formValues() {
        return Object.fromEntries([...form.querySelectorAll('input[data-key]')]
          .map((input) => [input.dataset.key, input.value]));
      }

      function showError(error) {
        status.textContent = `Erro: ${error.message}`;
      }

      function render(next) {
        state = next;
        const centralOnly = state.sourcesDeleted;
        intro.textContent = centralOnly
          ? 'As seis fontes foram excluídas. Esta tela mantém apenas o endpoint e o token para alimentar a planilha central com novas vagas.'
          : 'Configure as fontes para mesclar alertas em uma planilha central.';
        migrationActions.hidden = centralOnly;
        form.replaceChildren();
        state.sheets
          .filter((sheet) => !centralOnly || sheet.isCentral)
          .forEach((sheet) => {
            const label = document.createElement('label');
            label.textContent = sheet.label;
            const input = document.createElement('input');
            input.dataset.key = sheet.key;
            input.placeholder = 'Criada pelo botão acima';
            input.value = sheet.spreadsheetUrl;
            input.readOnly = true;
            label.append(input);
            form.append(label);
          });

        const endpointLabel = document.createElement('label');
        endpointLabel.textContent = 'Endpoint do adapter';
        const endpoint = document.createElement('textarea');
        endpoint.readOnly = true;
        endpoint.value = state.endpoint || 'Disponível após a implantação como Web App.';
        endpointLabel.append(endpoint);
        form.append(endpointLabel);

        const tokenLabel = document.createElement('label');
        tokenLabel.textContent = 'Token de acesso';
        const token = document.createElement('textarea');
        token.readOnly = true;
        token.value = state.accessToken || 'Disponível após criar a planilha central.';
        tokenLabel.append(token);
        form.append(tokenLabel);

        const hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = centralOnly
          ? 'Os userscripts usam o endpoint e o token para salvar novas vagas na central. Nenhuma configuração de fontes é necessária.'
          : 'A exclusão só será feita depois de você confirmar a cópia central.';
        form.append(hint);
      }
    </script>
  </body>
</html>
